<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fond sombre -->
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Titre -->
  <text x="600" y="280" font-family="Inter, sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.02em">
    POINT THE MAP
  </text>
  
  <!-- Description FR -->
  <text x="600" y="360" font-family="Inter, sans-serif" font-size="32" font-weight="400" fill="#94a3b8" text-anchor="middle">
    5 capitales · 5 secondes par ville
  </text>
  <text x="600" y="410" font-family="Inter, sans-serif" font-size="28" font-weight="400" fill="#64748b" text-anchor="middle">
    Cliquez sur la carte, gagnez des points
  </text>
  
  <!-- Favicon centré en dessous de la description -->
  <g transform="translate(600, 400) scale(8)">
    <!-- Carré avec bords arrondis, fond bleu (sans border) -->
    <rect x="2" y="2" width="28" height="28" rx="6" ry="6" fill="#0f172a"/>
    <!-- Cercle jaune parfaitement centré -->
    <circle cx="16" cy="16" r="10" fill="#facc15"/>
  </g>
</svg>
