name: Deploy to itch.io
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: josephbmanley/butler-publish-itchio-action@master
      env:
        BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        ITCH_GAME: point-the-map
        ITCH_USER: vandanael
        CHANNEL: web
        PACKAGE: .
