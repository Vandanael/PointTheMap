name: Deploy to itch.io
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Deploy with Butler (Docker)
      run: |
        # On utilise directement l'image officielle de Itch.io
        # -v $(pwd):/src  -> On donne l'accès au dossier actuel
        # push /src       -> On envoie le contenu de ce dossier
        
        docker run --rm \
          -e BUTLER_API_KEY=${{ secrets.BUTLER_CREDENTIALS }} \
          -v $(pwd):/src \
          itchio/butler:latest \
          push /src vandanael/point-the-map:web --userversion-file VERSION || \
          docker run --rm \
          -e BUTLER_API_KEY=${{ secrets.BUTLER_CREDENTIALS }} \
          -v $(pwd):/src \
          itchio/butler:latest \
          push /src vandanael/point-the-map:web
