<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />

    <!-- Main CSS (in production: inlined critical + async full CSS via build plugin) -->
    <link rel="stylesheet" href="/src/styles/styles.css" />

    <!-- SEO Meta Description -->
    <meta
      name="description"
      content="Addictive geography game: locate 5 world capitals in 5 seconds per city. Test your geography knowledge, earn points, and challenge your friends!"
    />

    <title>Point The Map</title>
    <link rel="icon" href="/favicon.svg" />

    <!-- Resource Hints - Early connection to external domains -->
    <link rel="dns-prefetch" href="https://basemaps.cartocdn.com" />

    <!-- Preload only mobile start-screen (LCP candidate); tablet/desktop load via CSS when shown to avoid "preloaded but not used" (bg is display:none until start-screen-visible) -->
    <link
      rel="preload"
      href="/assets/start-screen-mobile-dark.webp"
      as="image"
      type="image/webp"
      media="(max-width: 767px)"
    />

    <link rel="canonical" href="https://pointthemap.net/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pointthemap.net/" />
    <meta property="og:title" content="Point The Map" />
    <meta
      property="og:description"
      content="5 capitals · 5 seconds per city. Click on the map, earn points!"
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Point The Map" />
    <meta
      name="twitter:description"
      content="5 capitals · 5 seconds per city. Click on the map, earn points!"
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Prefetch GeoJSON data at low priority during idle time -->
    <link rel="prefetch" href="/data/countries.geojson" as="fetch" crossorigin />
    <link rel="prefetch" href="/data/civilizations.geojson" as="fetch" crossorigin />

    <!-- Plausible analytics injected on build only (see vite.config.js) -->
  </head>
  <body class="dark-theme">
    <script src="/theme-init.js"></script>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main id="main-content">
      <div id="app">
        <div id="map"></div>
        <div id="start-screen-bg" class="start-screen-bg" aria-hidden="true"></div>
        <!-- LCP skeleton - matches start screen layout exactly, removed after start screen paints on top -->
        <div id="start-skeleton" class="start-skeleton" aria-hidden="true">
          <div class="start-skeleton-header">
            <div class="skeleton-icon skeleton-shimmer"></div>
            <div class="skeleton-icon skeleton-shimmer"></div>
            <div class="skeleton-icon skeleton-shimmer"></div>
          </div>
          <div class="flex-1 flex items-center justify-center px-4 md:px-6 lobby-container">
            <div class="w-full lobby-content">
              <h1 class="lobby-title">
                <div class="lobby-title-line">POINT</div>
                <div class="lobby-title-line">THE MAP</div>
              </h1>

              <div class="lobby-main">
                <div class="lobby-challenge-wrapper">
                  <div class="skeleton-card">
                    <div
                      class="skeleton-line skeleton-line-lg skeleton-shimmer"
                      style="width: 70%"
                    ></div>
                    <div class="skeleton-line skeleton-shimmer" style="width: 90%"></div>
                    <div class="skeleton-line skeleton-shimmer" style="width: 80%"></div>
                  </div>
                </div>
                <div class="lobby-categories-wrapper">
                  <div class="skeleton-grid">
                    <div class="skeleton-tile skeleton-shimmer"></div>
                    <div class="skeleton-tile skeleton-shimmer"></div>
                    <div class="skeleton-tile skeleton-shimmer"></div>
                    <div class="skeleton-tile skeleton-shimmer"></div>
                  </div>
                </div>
              </div>

              <div class="lobby-actions">
                <div class="skeleton-mode">
                  <div class="skeleton-line skeleton-shimmer" style="width: 45%"></div>
                  <div class="skeleton-pill-toggle">
                    <div class="skeleton-pill skeleton-shimmer"></div>
                    <div class="skeleton-pill skeleton-shimmer"></div>
                  </div>
                </div>
                <div class="skeleton-play skeleton-shimmer"></div>
              </div>
            </div>
          </div>

          <div class="lobby-footer">
            <div class="lobby-footer-content">
              <div class="skeleton-line skeleton-shimmer" style="width: 220px"></div>
              <div class="skeleton-line skeleton-shimmer" style="width: 120px"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
