<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <!-- SEO Meta Description -->
  <meta name="description" content="Jeu de géographie addictif : localisez 5 capitales mondiales en 5 secondes par ville. Testez vos connaissances géographiques, gagnez des points et défiez vos amis !">

  <title>Point The Map</title>
  <link rel="icon" href="/favicon.svg">

  <!-- Resource Hints - Early connection to external domains -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://basemaps.cartocdn.com">
  <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Point The Map">
  <meta property="og:description" content="5 capitales · 5 secondes par ville. Cliquez sur la carte, gagnez des points !">
  <meta property="og:image" content="/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Point The Map">
  <meta name="twitter:description" content="5 capitales · 5 secondes par ville. Cliquez sur la carte, gagnez des points !">
  <meta name="twitter:image" content="/og-image.png">

  <!-- Google Fonts - Optimized async loading -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" as="style">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"></noscript>

  <!-- Preload main module for faster execution -->
  <link rel="modulepreload" href="/src/main.js">
</head>
<body>
  <div id="app">
    <div id="map"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
