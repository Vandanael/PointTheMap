<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PointTheMap - Jeu de Géographie</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html, body {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
            overscroll-behavior: none;
        }

        body {
            margin: 0;
            padding: 0;
        }

        #map {
            height: 100vh;
            width: 100vw;
            cursor: crosshair;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        .game-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            pointer-events: none;
        }

        .game-header > * {
            pointer-events: auto;
        }

        .marker-target {
            background-color: #facc15;
            border: 3px solid #ffffff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            box-shadow: 0 0 20px #facc15, 0 0 40px #facc15;
            position: relative;
        }

        .marker-target::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 2px solid #facc15;
            border-radius: 50%;
            animation: pulse-ring 2s ease-out infinite;
        }

        .marker-player {
            background-color: #60a5fa;
            border: 3px solid #ffffff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            box-shadow: 0 0 15px #60a5fa;
        }

        @keyframes pulse-ring {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(2);
                opacity: 0;
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.95;
            }
        }

        .pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-content {
            animation: fadeIn 0.3s ease-out;
        }

        .btn-scale {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-scale:active {
            transform: scale(0.95);
        }

        /* Timer bar */
        #timerBar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: rgba(15, 23, 42, 0.8);
            z-index: 1001;
            pointer-events: none;
        }

        #timerProgress {
            height: 100%;
            background: linear-gradient(90deg, #facc15 0%, #fbbf24 50%, #fb923c 100%);
            width: 100%;
            transition: width linear;
            box-shadow: 0 0 10px #facc15;
        }

        /* Masquer toute attribution Leaflet */
        .leaflet-control-attribution,
        .leaflet-bottom {
            display: none !important;
        }
    </style>
</head>
<body class="bg-slate-900">
    <!-- Timer Bar -->
    <div id="timerBar">
        <div id="timerProgress"></div>
    </div>

    <!-- Header du jeu -->
    <div class="game-header">
        <div class="bg-slate-950/95 backdrop-blur-sm border-b-2 border-yellow-400 px-4 py-3 flex justify-between items-center">
            <div class="text-white">
                <div class="text-sm font-medium text-slate-400">Manche</div>
                <div class="text-2xl font-bold" id="roundDisplay">1/5</div>
            </div>
            <div class="text-center">
                <div class="text-3xl font-black text-yellow-400">
                    PointTheMap
                </div>
            </div>
            <div class="text-white text-right">
                <div class="text-sm font-medium text-slate-400">Score</div>
                <div class="text-2xl font-bold text-yellow-400" id="scoreDisplay">0</div>
            </div>
        </div>
    </div>

    <!-- Carte -->
    <div id="map"></div>

    <!-- Modal de démarrage -->
    <div id="startModal" class="fixed inset-0 bg-slate-950/98 z-[2000] flex flex-col">
        <div class="flex-1 flex items-center justify-center p-4">
            <div class="text-center modal-content max-w-md w-full">
                <h1 class="text-7xl font-black text-yellow-400 mb-6 tracking-tight drop-shadow-lg">
                    PointTheMap
                </h1>
                <div class="bg-slate-900/50 backdrop-blur-sm rounded-xl p-6 mb-6 border border-yellow-400/20">
                    <p class="text-slate-300 text-xl mb-4 font-semibold">
                        ⏱️ 5s Challenge
                    </p>
                    <p class="text-slate-400 text-lg mb-2">
                        5 capitales · 5 secondes par ville
                    </p>
                    <p class="text-slate-500 text-sm">
                        Clique sur la carte, gagne des points !
                    </p>
                </div>
                <button onclick="startGame()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black py-5 px-6 rounded-xl text-xl btn-scale shadow-lg shadow-yellow-400/30 mb-3">
                    COMMENCER
                </button>
                <div class="text-slate-500 text-sm">
                    Démarrage automatique dans 1.5s...
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="w-full bg-slate-900/50 backdrop-blur-sm border-t border-yellow-400/20 py-4 px-6">
            <div class="text-center">
                <p class="text-slate-400 text-sm mb-1">
                    Made by
                    <a href="https://github.com/Vandanael" target="_blank" rel="noopener noreferrer" class="text-yellow-400 hover:text-yellow-300 font-semibold transition-colors underline decoration-yellow-400/30 hover:decoration-yellow-300">
                        Vandanael
                    </a>
                </p>
                <p class="text-slate-600 text-xs">
                    Open source on GitHub
                </p>
            </div>
        </div>
    </div>

    <!-- Modal question -->
    <div id="questionModal" class="fixed inset-0 bg-slate-950/95 z-[2000] flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900/90 backdrop-blur-md rounded-2xl shadow-2xl max-w-md w-full p-8 border-2 border-yellow-400 pulse modal-content">
            <div class="text-center">
                <div class="text-yellow-400 text-sm font-semibold mb-2">Trouvez :</div>
                <h2 class="text-4xl font-black text-white mb-2" id="capitalName"></h2>
                <div class="text-slate-400 text-lg mb-6" id="countryName"></div>
                <div class="bg-slate-950/50 rounded-lg p-4 text-slate-300 text-sm">
                    📍 Cliquez sur la carte
                </div>
            </div>
        </div>
    </div>

    <!-- Modal résultat -->
    <div id="resultModal" class="fixed inset-0 bg-slate-950/95 z-[2000] flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900/90 backdrop-blur-md rounded-2xl shadow-2xl max-w-md w-full p-8 border-2 border-yellow-400 modal-content">
            <div class="text-center mb-6">
                <div id="resultIcon" class="text-6xl mb-4"></div>
                <div class="text-slate-400 text-sm font-semibold mb-2">Distance</div>
                <div class="text-3xl font-bold text-white mb-4" id="distanceDisplay"></div>
                <div class="text-slate-400 text-sm font-semibold mb-2">Points gagnés</div>
                <div class="text-5xl font-black text-yellow-400 mb-2" id="pointsDisplay"></div>
            </div>
            <button onclick="nextRound()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-bold py-4 px-6 rounded-xl text-lg btn-scale shadow-lg shadow-yellow-400/20">
                Continuer
            </button>
        </div>
    </div>

    <!-- Modal score final -->
    <div id="finalModal" class="fixed inset-0 bg-slate-950/98 z-[2000] flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900/90 backdrop-blur-md rounded-2xl shadow-2xl max-w-md w-full p-8 border-2 border-yellow-400 modal-content">
            <h2 class="text-4xl font-black text-yellow-400 mb-8 text-center tracking-tight">
                GAME OVER
            </h2>
            <div class="text-center mb-8">
                <div class="text-slate-400 text-sm font-semibold mb-2">Score final</div>
                <div class="text-7xl font-black text-yellow-400 mb-4" id="finalScoreDisplay"></div>
                <div class="text-slate-300 text-xl mb-6" id="finalRating"></div>
                <div class="text-slate-500 text-sm" id="finalSummary"></div>
            </div>
            <div class="space-y-3">
                <button onclick="location.reload()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black py-5 px-6 rounded-xl text-xl btn-scale shadow-lg shadow-yellow-400/30">
                    REJOUER
                </button>
                <button onclick="shareScore()" class="w-full bg-slate-800 hover:bg-slate-700 text-yellow-400 font-bold py-4 px-6 rounded-xl text-lg btn-scale border-2 border-yellow-400/30">
                    PARTAGER
                </button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Capitales data -->
    <script type="module">
        import { capitals } from './capitals.js';

        // Variables globales
        let map;
        let currentRound = 0;
        let totalScore = 0;
        let currentCapital = null;
        let gameActive = false;
        let targetMarker = null;
        let playerMarker = null;
        let lineMarker = null;

        // Timer variables
        let timerInterval = null;
        let timerTimeout = null;
        let timerStartTime = null;
        const TIMER_DURATION = 5000; // 5 secondes
        const GRACE_PERIOD = 500; // 500ms de délai de grâce

        // Initialisation de la carte
        function initMap() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([20, 0], 2);

            // Fond de carte CartoDB Positron No Labels
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                attribution: '' // Pas d'attribution pour un look app
            }).addTo(map);

            // Empêcher le zoom par double-clic
            map.doubleClickZoom.disable();

            // Gestionnaire de clic sur la carte
            map.on('click', function(e) {
                if (gameActive && currentCapital) {
                    handleMapClick(e.latlng);
                }
            });
        }

        // Fonctions du Timer
        function startTimer() {
            // Réinitialiser la barre à 100%
            const timerProgress = document.getElementById('timerProgress');
            timerProgress.style.transition = 'none';
            timerProgress.style.width = '100%';

            // Forcer le reflow pour que la transition fonctionne
            timerProgress.offsetHeight;

            // Attendre le délai de grâce avant de démarrer
            timerTimeout = setTimeout(() => {
                timerStartTime = performance.now();
                timerProgress.style.transition = `width ${TIMER_DURATION}ms linear`;
                timerProgress.style.width = '0%';

                // Déclencher le timeout après 5 secondes
                timerTimeout = setTimeout(() => {
                    if (gameActive) {
                        handleTimeout();
                    }
                }, TIMER_DURATION);
            }, GRACE_PERIOD);
        }

        function stopTimer() {
            // Nettoyer tous les timers
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            if (timerTimeout) {
                clearTimeout(timerTimeout);
                timerTimeout = null;
            }
            timerStartTime = null;

            // Arrêter la barre de progression
            const timerProgress = document.getElementById('timerProgress');
            timerProgress.style.transition = 'none';
        }

        function handleTimeout() {
            if (!gameActive || !currentCapital) return;

            gameActive = false;
            stopTimer();

            // Simuler un clic au centre de la capitale avec 0 points
            const targetLatLng = L.latLng(currentCapital.lat, currentCapital.lng);

            // Placer uniquement le marqueur target (pas de player marker car pas de clic)
            targetMarker = L.marker([currentCapital.lat, currentCapital.lng], {
                icon: L.divIcon({
                    className: 'marker-target',
                    iconSize: [20, 20]
                })
            }).addTo(map);

            // Zoom sur la capitale
            map.setView([currentCapital.lat, currentCapital.lng], 6);

            // Afficher le résultat avec 0 points
            document.getElementById('distanceDisplay').textContent = 'Temps écoulé !';
            document.getElementById('pointsDisplay').textContent = '+0';
            document.getElementById('resultIcon').textContent = '⏱️';

            setTimeout(() => {
                document.getElementById('resultModal').classList.remove('hidden');
            }, 1000);
        }

        // Démarrer le jeu
        window.startGame = function() {
            document.getElementById('startModal').classList.add('hidden');
            currentRound = 0;
            totalScore = 0;
            nextRound();
        }

        // Manche suivante
        window.nextRound = function() {
            // Nettoyer les marqueurs précédents
            if (targetMarker) map.removeLayer(targetMarker);
            if (playerMarker) map.removeLayer(playerMarker);
            if (lineMarker) map.removeLayer(lineMarker);

            // Nettoyer le timer
            stopTimer();

            document.getElementById('resultModal').classList.add('hidden');

            currentRound++;

            if (currentRound > 5) {
                endGame();
                return;
            }

            // Tirer une capitale au hasard
            currentCapital = capitals[Math.floor(Math.random() * capitals.length)];

            // Réinitialiser la vue de la carte
            map.setView([20, 0], 2);

            // Afficher la question
            document.getElementById('roundDisplay').textContent = `${currentRound}/5`;
            document.getElementById('capitalName').textContent = currentCapital.name;
            document.getElementById('countryName').textContent = currentCapital.country;
            document.getElementById('questionModal').classList.remove('hidden');

            gameActive = true;

            // Démarrer le timer
            startTimer();

            // Cacher automatiquement le modal après 2 secondes
            setTimeout(() => {
                document.getElementById('questionModal').classList.add('hidden');
            }, 2000);
        }

        // Gérer le clic sur la carte
        function handleMapClick(clickLatLng) {
            if (!gameActive) return;

            gameActive = false;

            // Arrêter le timer immédiatement
            stopTimer();

            // Calculer la distance en km
            const targetLatLng = L.latLng(currentCapital.lat, currentCapital.lng);
            const distance = clickLatLng.distanceTo(targetLatLng) / 1000; // en km

            // Calculer le score (max 5000 points) - Formule exponentielle
            // Récompense TRÈS fortement la précision extrême
            let points = 0;
            if (distance < 1) {
                // Moins de 1km = score parfait
                points = 5000;
            } else if (distance < 25) {
                // Moins de 25km = excellent (4500-5000 pts)
                points = Math.round(5000 - Math.pow(distance, 1.3));
            } else if (distance < 100) {
                // Moins de 100km = très bon (3000-4500 pts)
                points = Math.round(4500 - Math.pow(distance - 25, 1.5) * 2);
            } else if (distance < 500) {
                // Moins de 500km = bon (1000-3000 pts)
                points = Math.round(3000 - Math.pow(distance - 100, 1.2) * 1.2);
            } else if (distance < 1500) {
                // Moins de 1500km = moyen (200-1000 pts)
                points = Math.round(1000 - Math.pow(distance - 500, 0.9) * 0.8);
            } else {
                // Plus de 1500km = faible (0-200 pts)
                points = Math.max(0, Math.round(200 - (distance - 1500) * 0.1));
            }

            const oldScore = totalScore;
            totalScore += points;

            // Placer les marqueurs
            targetMarker = L.marker([currentCapital.lat, currentCapital.lng], {
                icon: L.divIcon({
                    className: 'marker-target',
                    iconSize: [20, 20]
                })
            }).addTo(map);

            playerMarker = L.marker([clickLatLng.lat, clickLatLng.lng], {
                icon: L.divIcon({
                    className: 'marker-player',
                    iconSize: [20, 20]
                })
            }).addTo(map);

            // Calculer la couleur de la ligne selon la distance
            let lineColor;
            if (distance < 100) {
                lineColor = '#facc15'; // Jaune néon si très proche
            } else if (distance < 300) {
                lineColor = '#fbbf24'; // Jaune-orange
            } else if (distance < 600) {
                lineColor = '#fb923c'; // Orange
            } else if (distance < 1000) {
                lineColor = '#f87171'; // Rouge-orange
            } else {
                lineColor = '#dc2626'; // Rouge désaturé si éloigné
            }

            // Tracer une ligne entre les deux points
            lineMarker = L.polyline([
                [clickLatLng.lat, clickLatLng.lng],
                [currentCapital.lat, currentCapital.lng]
            ], {
                color: lineColor,
                weight: 3,
                dashArray: '10, 10',
                opacity: 0.9
            }).addTo(map);

            // Zoom sur la zone pour montrer l'écart
            const bounds = L.latLngBounds([clickLatLng, targetLatLng]);
            map.fitBounds(bounds, { padding: [50, 50], maxZoom: 10 });

            // Animation de count-up pour le score
            const duration = 800;
            const startTime = performance.now();
            const animateScore = (currentTime) => {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const currentScore = Math.floor(oldScore + (points * progress));
                document.getElementById('scoreDisplay').textContent = currentScore;
                if (progress < 1) {
                    requestAnimationFrame(animateScore);
                } else {
                    document.getElementById('scoreDisplay').textContent = totalScore;
                }
            };
            requestAnimationFrame(animateScore);

            // Afficher le résultat
            const distanceText = distance < 1
                ? `${Math.round(distance * 1000)} m`
                : `${Math.round(distance)} km`;

            document.getElementById('distanceDisplay').textContent = distanceText;
            document.getElementById('pointsDisplay').textContent = `+${points}`;

            // Icône selon la performance
            let icon = '🎯';
            if (distance < 50) icon = '🏆';
            else if (distance < 200) icon = '🎯';
            else if (distance < 500) icon = '👍';
            else if (distance < 1000) icon = '👌';
            else icon = '🤔';

            document.getElementById('resultIcon').textContent = icon;

            setTimeout(() => {
                document.getElementById('resultModal').classList.remove('hidden');
            }, 1000);
        }

        // Terminer le jeu
        function endGame() {
            // Arrêter le timer
            stopTimer();

            document.getElementById('finalScoreDisplay').textContent = totalScore;

            let rating = '';
            if (totalScore >= 23000) rating = '🏆 Champion absolu !';
            else if (totalScore >= 20000) rating = '⭐ Expert géographique !';
            else if (totalScore >= 17000) rating = '🎯 Excellent score !';
            else if (totalScore >= 13000) rating = '👍 Bien joué !';
            else if (totalScore >= 8000) rating = '👌 Pas mal !';
            else rating = '📚 Continue à t\'entraîner !';

            document.getElementById('finalRating').textContent = rating;
            document.getElementById('finalSummary').textContent = `5 capitales en ${Math.floor(performance.now() / 1000)}s`;
            document.getElementById('finalModal').classList.remove('hidden');
        }

        // Fonction de partage
        window.shareScore = function() {
            const text = `📍 PointTheMap
🌍 Score: ${totalScore}/25000
⏱️ 5s Challenge
🗺️ 5 capitales, 1 run
🚀 À battre ici : https://github.com/YourUsername/PointTheMap`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('Score copié ! Partage-le avec tes potes.');
                }).catch(() => {
                    // Fallback
                    prompt('Copie ce texte pour partager ton score:', text);
                });
            } else {
                // Fallback pour navigateurs plus anciens
                prompt('Copie ce texte pour partager ton score:', text);
            }
        }

        // Initialiser au chargement
        initMap();
        window.capitals = capitals;

        // Auto-démarrage après 1.5 secondes
        setTimeout(() => {
            startGame();
        }, 1500);
    </script>
</body>
</html>
